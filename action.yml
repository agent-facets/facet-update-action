name: Facet Update
description: Keep a project's facets current on a schedule and open a pull request when any of them move.
author: Agent Facets

branding:
  icon: refresh-cw
  color: purple

inputs:
  strategy:
    description: How far to move each facet, latest or in-range.
    required: false
    default: latest
  cli-version:
    description: Version of the agent-facets CLI to run.
    required: false
    default: 0.33.1
  adapter:
    description: Exact version of a first-party materialization adapter (claude-code, opencode, or codex), as name@M.N.P.
    required: true
  working-directory:
    description: Directory containing facets.json.
    required: false
    default: .
  dry-run:
    description: Report what would change and stop without GitHub mutations.
    required: false
    default: 'false'
  open-pr:
    description: Open or refresh a pull request when facets change.
    required: false
    default: 'true'
  branch:
    description: Branch to push the update onto.
    required: false
    default: facet-updates
  base:
    description: Branch the pull request targets. Defaults to the repository default branch.
    required: false
    default: ''
  commit-message:
    description: First line of the generated commit message.
    required: false
    default: 'chore(facets): update facets'
  pr-title:
    description: Title of the pull request.
    required: false
    default: 'chore(facets): update facets'
  pr-author:
    description: GitHub login expected to own generated pull requests.
    required: false
    default: 'github-actions[bot]'
  labels:
    description: Comma-separated labels to apply. Label failures are nonfatal.
    required: false
    default: ''
  token:
    description: Token used for pull request API calls.
    required: false
    default: ${{ github.token }}

outputs:
  updated:
    description: '"true" when at least one facet changed.'
    value: ${{ steps.update.outputs.updated }}
  count:
    description: How many facets changed.
    value: ${{ steps.update.outputs.count }}
  pr-url:
    description: URL of the pull request opened or refreshed, empty when none was.
    value: ${{ steps.update.outputs.pr-url }}

runs:
  using: composite
  steps:
    - name: Publish facet update
      id: update
      shell: bash
      env:
        FACET_STRATEGY: ${{ inputs.strategy }}
        FACET_CLI_VERSION: ${{ inputs.cli-version }}
        FACET_ADAPTER: ${{ inputs.adapter }}
        FACET_WORKING_DIR: ${{ inputs.working-directory }}
        FACET_DRY_RUN: ${{ inputs.dry-run }}
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_AUTHOR: ${{ inputs.pr-author }}
        LABELS: ${{ inputs.labels }}
        OPEN_PR: ${{ inputs.open-pr }}
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish-update.sh"
