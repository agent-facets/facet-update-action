name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Both jobs assume a GitHub-hosted runner: shellcheck is preinstalled and the
# npm registry is reachable. On a self-hosted or network-restricted runner they
# fail for reasons unrelated to the code under test.
env:
  # Pinned so a new CLI release cannot turn this suite red on its own.
  FACET_CLI_PIN: '0.33.1'

jobs:
  shell-suites:
    name: Shell gates and hermetic suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck and Bash syntax gates
        run: |
          set -euo pipefail
          mapfile -t shell_scripts < <(printf '%s\n' scripts/*.sh | LC_ALL=C sort)
          shellcheck "${shell_scripts[@]}"
          for shell_script in "${shell_scripts[@]}"; do
            bash -n "$shell_script"
          done

      - name: Run every shell test suite in sorted order
        run: |
          set -euo pipefail
          mapfile -t test_scripts < <(printf '%s\n' scripts/*.test.sh | LC_ALL=C sort)
          for test_script in "${test_scripts[@]}"; do
            echo "::group::$test_script"
            bash "$test_script"
            echo '::endgroup::'
          done

  published-cli:
    name: Published agent-facets 0.33.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install with the published CLI
        run: |
          set -euo pipefail
          mkdir -p /tmp/published-cli && cd /tmp/published-cli
          git init -q .
          git config user.email t@t
          git config user.name t
          printf '{ "facets": { "cowsay": "1.0.0" }, "manifestVersion": 0.1 }\n' > facets.json
          npx --yes "agent-facets@${FACET_CLI_PIN}" install --accept-mcp < /dev/null
          test -f facets.lock
          git add -A
          git commit -qm installed

      - name: Apply a real update
        run: |
          set -euo pipefail
          cd /tmp/published-cli
          node -e '
            const fs = require("fs")
            const lock = JSON.parse(fs.readFileSync("facets.lock", "utf8"))
            for (const entry of Object.values(lock.facets)) entry.version = "1.0.0"
            fs.writeFileSync("facets.lock", JSON.stringify(lock, null, 2) + "\n")
          '
          FACET_OUTPUT=/tmp/update.out FACET_STRATEGY=latest FACET_CLI_VERSION="$FACET_CLI_PIN" \
            bash "$GITHUB_WORKSPACE/scripts/facet-update.sh"
          grep -Fxq 'updated=true' /tmp/update.out
          grep -Fxq 'count=1' /tmp/update.out
          git add -A
          git commit -qm updated

      - name: Report a no-op when current
        run: |
          set -euo pipefail
          cd /tmp/published-cli
          FACET_OUTPUT=/tmp/no-op.out FACET_STRATEGY=latest FACET_CLI_VERSION="$FACET_CLI_PIN" \
            bash "$GITHUB_WORKSPACE/scripts/facet-update.sh"
          printf 'updated=false\ncount=0\nsummary=\n' > /tmp/no-op.expected
          cmp /tmp/no-op.expected /tmp/no-op.out

      - name: Preserve bytes during dry-run
        run: |
          set -euo pipefail
          cd /tmp/published-cli
          node -e '
            const fs = require("fs")
            const lock = JSON.parse(fs.readFileSync("facets.lock", "utf8"))
            for (const entry of Object.values(lock.facets)) entry.version = "1.0.0"
            fs.writeFileSync("facets.lock", JSON.stringify(lock, null, 2) + "\n")
          '
          sha256sum facets.json facets.lock > /tmp/published-cli.sha
          if ! dry_run_log=$(FACET_DRY_RUN=true FACET_OUTPUT=/tmp/dry-run.out \
            FACET_STRATEGY=latest FACET_CLI_VERSION="$FACET_CLI_PIN" \
            bash "$GITHUB_WORKSPACE/scripts/facet-update.sh" 2>&1); then
            printf '%s\n' "$dry_run_log"
            exit 1
          fi
          printf '%s\n' "$dry_run_log"
          grep -Fxq 'facet-update: updated=false count=0' <<< "$dry_run_log"
          printf 'updated=false\ncount=0\nsummary=\n' > /tmp/dry-run.expected
          cmp /tmp/dry-run.expected /tmp/dry-run.out
          sha256sum --check --status /tmp/published-cli.sha

  action:
    name: action.yml wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the CLI input default is pinned
        run: |
          ruby -e "require 'yaml'; action = YAML.load_file('action.yml'); abort 'cli-version default is not pinned' unless action.fetch('inputs').fetch('cli-version').fetch('default') == ENV.fetch('FACET_CLI_PIN')"

      # A fixture the action can point at, so this exercises action.yml's own
      # input plumbing rather than only the script.
      - name: Build a fixture
        run: |
          set -euo pipefail
          mkdir -p fixture && cd fixture
          printf '{ "facets": { "cowsay": "1.0.0" }, "manifestVersion": 0.1 }\n' > facets.json
          npx --yes "agent-facets@${FACET_CLI_PIN}" install --accept-mcp < /dev/null

      # dry-run proves the action resolves its inputs and runs the CLI without
      # reaching the push or pull-request steps, so this needs no write token.
      # Record the exact bytes first: the fixture is untracked, so a git-based
      # check would pass without proving anything.
      - name: Record fixture state
        run: |
          set -euo pipefail
          sha256sum fixture/facets.json fixture/facets.lock > /tmp/fixture.sha

      - name: Run the action in dry-run
        id: dry
        uses: ./
        with:
          working-directory: fixture
          strategy: latest
          dry-run: 'true'

      - name: Dry-run reports no change and writes nothing
        env:
          UPDATED: ${{ steps.dry.outputs.updated }}
          COUNT: ${{ steps.dry.outputs.count }}
          SUMMARY: ${{ steps.dry.outputs.summary }}
        run: |
          set -euo pipefail
          [ "$UPDATED" = "false" ] || { echo "dry-run reported updated=$UPDATED"; exit 1; }
          [ "$COUNT" = "0" ] || { echo "dry-run reported count=$COUNT"; exit 1; }
          [ -z "$SUMMARY" ] || { echo "dry-run reported summary=$SUMMARY"; exit 1; }
          sha256sum --check --status /tmp/fixture.sha \
            || { echo "dry-run modified the fixture"; exit 1; }
