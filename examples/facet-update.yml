# Save this as .github/workflows/facet-update.yml in your repository.
name: Facet update

on:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Queue runs for this repository's facet-updates branch. Let a run finish once
# it has started preparing the branch.
concurrency:
  group: facet-update-${{ github.repository }}-facet-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: agent-facets/facet-update-action@v1
        with:
          strategy: latest
          cli-version: '0.33.1'
          labels: facets,dependencies
